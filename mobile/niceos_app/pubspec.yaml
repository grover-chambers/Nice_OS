name: niceos_app
description: NiceOS mobile app for Market Link Ltd field operations
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  geolocator: ^11.0.0
  google_maps_flutter: ^2.5.3
  camera: ^0.11.0
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  flutter_local_notifications: ^16.3.0
  intl: ^0.19.0
  uuid: ^4.2.1
  connectivity_plus: ^5.0.2
  device_info_plus: ^9.0.0
  supabase_flutter: ^2.3.0
  flutter_dotenv: ^5.1.0
  equatable: ^2.0.5
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
